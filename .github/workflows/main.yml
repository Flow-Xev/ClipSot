
name: ClipSot Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed ClipSot APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract uploaded source ZIP
      - name: Extract ClipSot source
        run: |
          test -f ClipSot_stage3b.zip
          mkdir extracted
          unzip -q ClipSot_stage3b.zip -d extracted
          cp -a extracted/clipsot/. .
          test -f pubspec.yaml
          test -f setup.sh

      # 3. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Generate Android project
      - name: Generate Android project
        run: |
          chmod +x setup.sh
          ./setup.sh

      # 6. Configure release signing
      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/clipsot-release.jks
          test -s android/app/clipsot-release.jks

      # 7. Configure Gradle signing
      - name: Configure Gradle signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Expected build.gradle.kts was not generated")

          s = p.read_text()

          signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                      storeFile = file("clipsot-release.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
          """

          if 'create("release")' not in s:
              s = s.replace("android {", "android {" + signing, 1)

          pattern = r'(buildTypes\\s*\\{\\s*release\\s*\\{)'
          s, count = re.subn(
              pattern,
              r'\\1\n            signingConfig = signingConfigs.getByName("release")',
              s,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not configure release build type")

          p.write_text(s)
          PY

      # 8. Run tests
      - name: Run Flutter tests
        run: flutter test

      # 9. Build signed APK
      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release

      # 10. Upload APK
      - name: Upload ClipSot APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipSot-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
